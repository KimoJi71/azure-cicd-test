version: 2.1
orbs:
  aws-ecr: circleci/aws-ecr@6.0.0
executors:
  node-executor:
    docker:
      - image: cimg/node:lts
jobs:
  build:
    executor: node-executor
    steps:
      - checkout
      - setup_remote_docker:
          version: 20.10.7
      - run:
          name: Build Docker Image
          command: docker build -t my-app .
      - aws-ecr/push-image:
          repo: my-ecr-repo
          tag: latest
workflows:
  version: 2
  build-and-push:
    jobs:
      - build:
          context: aws-ecr-context